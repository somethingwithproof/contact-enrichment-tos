version: 2
updates:
  - package-ecosystem: "maven"
    cooldown:
      default-days: 7
    directory: "/implementations/java"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    rebase-strategy: "auto"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "maven"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      major-upgrades:
        applies-to: version-updates
        update-types:
          - "major"
      security-updates:
        applies-to: security-updates

  - package-ecosystem: "github-actions"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    rebase-strategy: "auto"
    labels:
      - "dependencies"
      - "ci"

  - package-ecosystem: "docker"
    cooldown:
      default-days: 7
    directory: "/implementations/java"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    rebase-strategy: "auto"
    labels:
      - "dependencies"
      - "docker"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      major-upgrades:
        applies-to: version-updates
        update-types:
          - "major"

  - package-ecosystem: "gomod"
    cooldown:
      default-days: 7
    directory: "/implementations/go"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    commit-message:
      prefix: "build(deps)"
    groups:
      gomod-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "cargo"
    cooldown:
      default-days: 7
    directory: "/implementations/rust"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    commit-message:
      prefix: "build(deps)"
    groups:
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    cooldown:
      default-days: 7
    directory: "/implementations/python"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    commit-message:
      prefix: "build(deps)"
    groups:
      pip-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    cooldown:
      default-days: 7
    directory: "/.github/commitlint"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    commit-message:
      prefix: "build(deps)"
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker-compose"
    cooldown:
      default-days: 7
    directory: "/deployments/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    commit-message:
      prefix: "build(deps)"
    groups:
      docker-compose-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
