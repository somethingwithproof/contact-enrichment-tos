name: Rust CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            implementations/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('implementations/rust/Cargo.lock') }}
      - name: Run tests (default features)
        working-directory: implementations/rust
        env:
          RUST_LOG: info
        run: cargo test --all --locked --verbose
